name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Code Quality (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Smoke Test (Iniciando a Aplicação)
        run: |
          npm start &
          API_PID=$!
          sleep 5
          curl -f http://localhost:3000/health
          kill $API_PID

  sast:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run NPM Audit
        run: npm audit --audit-level=high

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/api-filmes
          
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:v1.0.${{ github.run_number }} \
            .
            
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:v1.0.${{ github.run_number }}

  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    needs: [lint-and-test] 
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e DEFAULT_REGION=us-east-1 \
            -e LOCALSTACK_AUTH_TOKEN=${{ secrets.LOCALSTACK_AUTH_TOKEN }} \
            localstack/localstack:latest
          
          echo "Aguardando LocalStack ficar pronto..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:4566/_localstack/health | grep -q '"running"'; then
              echo "LocalStack está pronto!"
              exit 0
            fi
            echo "Tentativa $i/30..."
            sleep 3
          done
          echo "ERRO: LocalStack não iniciou a tempo!"
          docker logs localstack
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Initialize Terraform Remote State (LocalStack Mock)
        run: |
          aws --endpoint-url=http://localhost:4566 s3api create-bucket \
            --bucket tf-state-bucket \
            --region us-east-1

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Plan (Pull Request)
        if: github.event_name == 'pull_request'
        working-directory: ./terraform
        run: terraform plan -no-color

      - name: Terraform Apply (Push to Main)
        if: github.event_name == 'push'
        working-directory: ./terraform
        run: terraform apply -auto-approve
